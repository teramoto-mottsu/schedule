<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHRスケジュール管理ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3347;
  --accent: #4f8ef7;
  --accent2: #7c5cbf;
  --text: #e8eaf0;
  --text-muted: #7a7f9a;
  --danger: #f05c5c;
  --today: #f5a623;
  --sidebar-w: 220px;
  --header-h: 52px;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-size: 13px; }

/* ===== HEADER ===== */
header {
  height: var(--header-h); flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  z-index: 200;
}
.logo {
  width: var(--sidebar-w); flex-shrink: 0;
  display: flex; align-items: center; gap: 9px;
  font-weight: 700; font-size: 13px;
  padding: 0 14px; height: 100%;
  border-right: 1px solid var(--border);
}
.logo-icon {
  width: 26px; height: 26px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.header-center {
  flex: 1; display: flex; align-items: center;
  padding: 0 14px; gap: 10px; min-width: 0;
}
.project-title-input {
  background: transparent; border: none;
  font-family: inherit; font-size: 15px; font-weight: 700;
  color: var(--text); outline: none;
  border-bottom: 2px solid transparent; padding-bottom: 1px;
  transition: border-color 0.2s; flex: 1; min-width: 0;
}
.project-title-input:focus { border-color: var(--accent); }
.project-title-input[readonly] { cursor: default; }
.header-summary { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.header-actions { display: flex; gap: 6px; align-items: center; padding-right: 14px; flex-shrink: 0; }

/* ===== APP BODY ===== */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-hd {
  padding: 11px 12px 9px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.proj-list { flex: 1; overflow-y: auto; padding: 5px 0; }
.proj-item {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 12px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.12s;
}
.proj-item:hover { background: var(--surface2); }
.proj-item.active { background: rgba(79,142,247,0.1); border-left-color: var(--accent); }
.proj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.proj-name {
  flex: 1; font-size: 12px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.proj-item.active .proj-name { color: var(--accent); font-weight: 500; }
.proj-del {
  opacity: 0; background: transparent; border: none;
  color: var(--text-muted); cursor: pointer; font-size: 11px;
  padding: 2px 4px; border-radius: 4px; transition: all 0.12s; flex-shrink: 0;
}
.proj-item:hover .proj-del { opacity: 1; }
.proj-del:hover { color: var(--danger); background: rgba(240,92,92,0.1); }
.sidebar-ft { padding: 10px 12px; border-top: 1px solid var(--border); }

/* ===== MAIN ===== */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; color: var(--text-muted);
}
.empty-icon { font-size: 42px; opacity: 0.35; }
.gantt-outer {
  flex: 1; margin: 12px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); display: flex; flex-direction: column;
}
.gantt-scroll { flex: 1; overflow: auto; }
.gantt thead { position: sticky; top: 0; z-index: 20; }

/* ===== DRAG HANDLE ===== */
.drag-handle {
  cursor: grab; color: var(--text-muted); opacity: 0;
  font-size: 12px; padding: 0 3px; flex-shrink: 0;
  transition: opacity 0.15s; user-select: none;
}
tr:hover .drag-handle { opacity: 1; }
.drag-handle:active { cursor: grabbing; }
tr.drag-over-top    { border-top: 2px solid var(--accent) !important; }
tr.drag-over-bottom { border-bottom: 2px solid var(--accent) !important; }
tr.dragging         { opacity: 0.4; }

/* ===== BUTTONS ===== */
.btn {
  height: 30px; padding: 0 12px; border-radius: 7px; border: none;
  cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #6fa3ff; transform: translateY(-1px); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

/* ===== GANTT TABLE ===== */
table.gantt { border-collapse: collapse; table-layout: fixed; min-width: 900px; }
.gantt thead tr.month-row th {
  background: var(--surface2); color: var(--text-muted);
  font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
  padding: 5px 0; text-align: center;
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.gantt thead tr.date-row th {
  background: var(--surface2);
  font-family: 'DM Mono', monospace; font-size: 9px;
  color: var(--text-muted); text-align: center; padding: 3px 0;
  border-right: 1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid var(--border);
  min-width: 18px; width: 18px;
}
.gantt thead tr.date-row th.today-col { color: var(--today); background: rgba(245,166,35,0.12); }
.gantt thead tr.date-row th.weekend { color: rgba(122,127,154,0.4); }
.col-no    { width: 56px; min-width: 56px; }
.col-task  { width: 200px; min-width: 160px; }
.col-start { width: 100px; min-width: 90px; }
.col-end   { width: 100px; min-width: 90px; }
.col-owner { width: 110px; min-width: 90px; }
.col-days  { width: 52px; min-width: 48px; }
th.fixed, td.fixed { position: sticky; background: var(--surface); z-index: 5; }

/* ===== COLUMN RESIZER ===== */
.col-resizer {
  display: inline-block;
  width: 6px; height: 100%;
  cursor: col-resize;
  position: absolute; right: 0; top: 0; bottom: 0;
  z-index: 1;
  user-select: none;
}
.col-resizer::after {
  content: '';
  display: block;
  position: absolute;
  right: 1px; top: 20%; bottom: 20%; width: 2px;
  background: var(--border);
  border-radius: 2px;
  transition: background 0.15s;
}
.col-resizer:hover::after, .col-resizer.active::after { background: var(--accent); }
th.fixed { background: var(--surface2); z-index: 10; }
th.col-no, td.col-no     { left: 0; }
th.col-task, td.col-task { left: 56px; }
th.col-start, td.col-start { left: 256px; }
th.col-end, td.col-end   { left: 356px; }
th.col-owner, td.col-owner { left: 456px; }
th.col-days, td.col-days { left: 566px; }
td.col-days::after, th.col-days::after {
  content: ''; position: absolute;
  top: 0; right: -8px; bottom: 0; width: 8px;
  background: linear-gradient(to right, rgba(0,0,0,0.28), transparent);
  pointer-events: none;
}

/* ===== PRINT ===== */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body {
    background: #fff !important; color: #111 !important;
    height: auto !important; overflow: visible !important;
    display: block !important;
  }
  header, .sidebar, .modal-overlay, .tooltip, #autoSaveIndicator, #btnSaveHTML,
  .row-btn, #btnOwners, #btnSection, #btnTask, #btnPDF { display: none !important; }
  .app-body { display: block !important; height: auto !important; overflow: visible !important; }
  .main { display: block !important; height: auto !important; overflow: visible !important; }
  .gantt-outer {
    display: block !important; margin: 0 !important;
    border: none !important; border-radius: 0 !important;
    height: auto !important; overflow: visible !important;
  }
  .gantt-scroll { overflow: visible !important; height: auto !important; }
  table.gantt {
    width: 100% !important; table-layout: auto !important;
    border-collapse: collapse !important; font-size: 8pt !important;
  }
  .gantt thead tr.month-row th,
  .gantt thead tr.date-row th,
  .gantt tbody td,
  .gantt tbody tr.section-row td {
    background: #fff !important; color: #111 !important;
    border: 0.5pt solid #bbb !important;
    padding: 2pt 3pt !important;
  }
  .gantt thead tr.date-row th { min-width: 14pt !important; width: 14pt !important; font-size: 6pt !important; }
  .gantt thead tr.date-row th.today-col { background: #fff8e1 !important; }
  .gantt thead tr.date-row th.weekend { color: #aaa !important; }
  .gantt tbody tr.section-row td { background: #f0f0f0 !important; font-weight: bold !important; }
  .gantt tbody td.date-col.today-col { background: #fffbe6 !important; }
  .gantt tbody td.date-col.weekend  { background: #fafafa !important; }
  th.fixed, td.fixed { position: static !important; }
  td.col-days::after, th.col-days::after { display: none !important; }
  .gantt-bar {
    height: 10pt !important; border-radius: 2pt !important;
    position: absolute !important; opacity: 1 !important;
    -webkit-print-color-adjust: exact !important;
  }
  .editable {
    border: none !important; background: transparent !important;
    color: #111 !important; padding: 0 !important;
  }
  select.editable { appearance: none !important; border: none !important; background: transparent !important; }
  .legend { border-top: 0.5pt solid #bbb !important; padding: 4pt 8pt !important; }
  .legend-item { color: #111 !important; }
  .days-num { color: #111 !important; }
  .col-no   { width: 36pt !important; }
  .col-task { width: 120pt !important; }
  .col-start, .col-end { width: 60pt !important; }
  .col-owner { width: 70pt !important; }
  .col-days  { width: 28pt !important; }
  @page { size: A3 landscape; margin: 10mm; }
}
.gantt th {
  font-weight: 500; font-size: 10px; color: var(--text-muted);
  letter-spacing: 0.04em; padding: 7px 9px;
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  white-space: nowrap; text-transform: uppercase; text-align: left;
}
.gantt tbody tr { transition: background 0.1s; }
.gantt tbody tr:hover { background: rgba(79,142,247,0.04); }
.gantt tbody tr.section-row td {
  background: var(--surface2); font-weight: 700; font-size: 11px;
  letter-spacing: 0.05em; border-bottom: 1px solid var(--border); padding: 0;
}
.gantt tbody td {
  padding: 5px 8px; border-bottom: 1px solid rgba(46,51,71,0.5);
  border-right: 1px solid rgba(46,51,71,0.3);
  vertical-align: middle; white-space: nowrap;
}
.gantt tbody td.date-col {
  padding: 0; position: relative;
  border-right: 1px solid rgba(46,51,71,0.3);
}
.gantt tbody td.date-col.today-col { background: rgba(245,166,35,0.06); }
.gantt tbody td.date-col.weekend { background: rgba(255,255,255,0.01); }
.gantt-bar {
  height: 18px; border-radius: 4px;
  position: absolute; top: 50%; transform: translateY(-50%);
  opacity: 0.9; transition: opacity 0.2s; cursor: pointer;
}
.gantt-bar:hover { opacity: 1; }
.editable {
  background: transparent; border: 1px solid transparent;
  border-radius: 5px; padding: 2px 5px;
  font-family: inherit; font-size: 12px; color: var(--text); width: 100%;
  transition: border-color 0.15s, background 0.15s;
}
.editable:hover { border-color: var(--border); background: var(--surface2); }
.editable:focus { outline: none; border-color: var(--accent); background: var(--surface2); }
select.editable option { background: var(--surface2); }
.days-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); display: block; text-align: center; }
.row-btn {
  width: 20px; height: 20px; background: transparent;
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; transition: all 0.12s; flex-shrink: 0;
}
.row-btn:hover { border-color: var(--text-muted); color: var(--text); }
.row-btn.delete:hover { border-color: var(--danger); color: var(--danger); }
.row-btn.tgl { width: auto; min-width: 20px; padding: 0 4px; font-size: 9px; opacity: 0.55; }
.row-btn.tgl.on { opacity: 1; border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.12); }
.legend {
  display: flex; gap: 12px; flex-wrap: wrap;
  padding: 7px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 500;
  align-items: center; justify-content: center; backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px; width: 460px; max-width: 95vw;
  animation: modalIn 0.18s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
.form-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 11px; font-family: inherit;
  font-size: 13px; color: var(--text); outline: none; transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--accent); }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ===== TEMPLATE CARDS ===== */
.tpl-card {
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 12px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  background: var(--surface2);
}
.tpl-card:hover { border-color: var(--accent); background: rgba(79,142,247,0.06); }
.tpl-card.selected { border-color: var(--accent); background: rgba(79,142,247,0.12); }
.tpl-icon { font-size: 24px; margin-bottom: 7px; }
.tpl-label { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.tpl-desc { font-size: 10px; color: var(--text-muted); line-height: 1.5; }
.tpl-card.selected .tpl-label { color: var(--accent); }

/* ===== TOOLTIP ===== */
.tooltip {
  position: fixed; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 13px; font-size: 12px;
  pointer-events: none; z-index: 600; display: none;
  min-width: 170px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.tooltip-title { font-weight: 700; margin-bottom: 4px; }
.tooltip-row { display: flex; justify-content: space-between; gap: 16px; color: var(--text-muted); font-size: 11px; }
.tooltip-val { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📊</div>
    <span>RHRスケジュール管理ツール</span>
  </div>
  <div class="header-center">
    <input class="project-title-input" id="projectTitle" placeholder="← プロジェクトを選択" readonly />
    <span class="header-summary" id="summaryText"></span>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btnOwners"  onclick="openOwnersModal()" style="display:none;">👤 担当者</button>
    <button class="btn btn-ghost" id="btnSection" onclick="addSection()"      style="display:none;">＋ セクション</button>
    <button class="btn btn-secondary" id="btnTask" onclick="openAddModal()"   style="display:none;">＋ タスク</button>
    <button class="btn btn-ghost" id="btnPDF"     onclick="exportPDF()"       style="display:none;">↓ PDF</button>
    <div style="width:1px;height:20px;background:var(--border);flex-shrink:0;"></div>
    <button class="btn btn-ghost" id="btnSaveHTML" onclick="saveAsHTML()" title="現在のデータを埋め込んだHTMLをダウンロード">💾 保存</button>
    <div id="autoSaveIndicator" style="font-size:10px;color:var(--text-muted);white-space:nowrap;"></div>
  </div>
</header>

<div class="app-body">
  <aside class="sidebar">
    <div class="sidebar-hd">
      <span class="sidebar-label">プロジェクト一覧</span>
    </div>
    <div class="proj-list" id="projList"></div>
    <div class="sidebar-ft">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="addProject()">＋ 新規プロジェクト</button>
    </div>
  </aside>

  <main class="main">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <div style="font-size:14px;">左のメニューからプロジェクトを選択</div>
      <button class="btn btn-primary" onclick="addProject()">＋ 新規プロジェクト作成</button>
    </div>
    <div class="gantt-outer" id="ganttOuter" style="display:none;">
      <div class="gantt-scroll">
        <table class="gantt" id="ganttTable">
          <thead id="ganttHead"></thead>
          <tbody id="ganttBody"></tbody>
        </table>
      </div>
      <div class="legend" id="legendArea"></div>
    </div>
  </main>
</div>

<!-- NEW PROJECT MODAL -->
<div class="modal-overlay" id="newProjModal">
  <div class="modal" style="width:500px;">
    <h3>新規プロジェクト作成</h3>
    <div class="form-row" style="margin-bottom:18px;">
      <label>プロジェクト名</label>
      <input class="form-input" id="newProjName" placeholder="例：○○様 採用サイト制作"
        onkeydown="if(event.key==='Enter')confirmNewProject()" />
    </div>
    <div class="form-row">
      <label style="margin-bottom:8px;display:block;">プロジェクト種別</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div class="tpl-card" data-tpl="site" onclick="selectTpl('site')">
          <div class="tpl-icon">🌐</div>
          <div class="tpl-label">サイト制作</div>
          <div class="tpl-desc">ヒアリング→設計→デザイン→マークアップ→納品</div>
        </div>
        <div class="tpl-card" data-tpl="pamphlet" onclick="selectTpl('pamphlet')">
          <div class="tpl-icon">📄</div>
          <div class="tpl-label">パンフレット制作</div>
          <div class="tpl-desc">ヒアリング→設計→デザイン→印刷→納品</div>
        </div>
        <div class="tpl-card" data-tpl="other" onclick="selectTpl('other')">
          <div class="tpl-icon">✏️</div>
          <div class="tpl-label">その他</div>
          <div class="tpl-desc">空のプロジェクト。自由にカスタマイズ</div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeNewProjModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="confirmNewProject()">作成</button>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">タスクを追加</h3>
    <div class="form-row"><label>タスク名</label><input class="form-input" id="f_name" placeholder="タスク名を入力" /></div>
    <div class="form-row"><label>No</label><input class="form-input" id="f_no" placeholder="例: 1-1" /></div>
    <div class="form-2col">
      <div class="form-row"><label>開始日</label><input class="form-input" id="f_start" type="date" /></div>
      <div class="form-row"><label>終了日</label><input class="form-input" id="f_end"   type="date" /></div>
    </div>
    <div class="form-row"><label>担当者</label><select class="form-input" id="f_owner"></select></div>
    <div class="form-row">
      <label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:12px;">
        <input type="checkbox" id="f_link" />
        <span style="color:var(--text)">前タスクの終了翌営業日を開始日にする</span>
      </label>
    </div>
    <div class="form-row"><label>セクション</label><select class="form-input" id="f_section"></select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveTask()">保存</button>

function addProject(){
  document.getElementById('newProjModal').classList.add('open');
  document.getElementById('newProjName').value = '';
  document.querySelectorAll('.tpl-card').forEach(c=>c.classList.remove('selected'));
  document.querySelector('.tpl-card[data-tpl="site"]').classList.add('selected');
  selectedTpl = 'site';
  setTimeout(()=>document.getElementById('newProjName').focus(), 80);
}

function selectTpl(type){
  selectedTpl = type;
  document.querySelectorAll('.tpl-card').forEach(c=>c.classList.remove('selected'));
  document.querySelector(`.tpl-card[data-tpl="${type}"]`).classList.add('selected');
}

function closeNewProjModal(){
  document.getElementById('newProjModal').classList.remove('open');
}

function confirmNewProject(){
  const name = document.getElementById('newProjName').value.trim();
  if(!name){ document.getElementById('newProjName').focus(); return; }
  closeNewProjModal();

  const ts = String(Date.now());
  const id = 'p' + ts;
  const color = PROJ_COLORS[projects.length % PROJ_COLORS.length];
  const tpl = TEMPLATES[selectedTpl];

  // セクションIDを順番付きで新規発行
  const secIdMap = {};
  const newSections = [];
  for(let i = 0; i < tpl.sections.length; i++){
    const s = tpl.sections[i];
    const newId = 'sec_' + ts + '_' + i;
    secIdMap[s.id] = newId;
    newSections.push({ id: newId, label: s.label });
  }

  // タスクIDも順番付きで新規発行、sectionを差し替え
  const newTasks = [];
  for(let i = 0; i < tpl.tasks.length; i++){
    const t = tpl.tasks[i];
    newTasks.push({
      id: 'tsk_' + ts + '_' + i,
      section: secIdMap[t.section] || newSections[0].id,
      no: t.no,
      name: t.name,
      start: t.start,
      end: t.end,
      owner: t.owner,
      link: t.link,
    });
  }

  const newProj = {
    id: id,
    name: name,
    color: color,
    owners: tpl.owners.slice(),
    sections: newSections,
    tasks: newTasks,
  };
  projects.push(newProj);
  renderSidebar();
  selectProject(id);
}

function deleteProject(id){
  if(projects.length<=1){ alert('プロジェクトが1件のみのため削除できません'); return; }
  const p = projects.find(p=>p.id===id);
  if(!confirm(`「${p.name}」を削除しますか？`)) return;
  projects = projects.filter(p=>p.id!==id);
  if(currentPid===id){
    currentPid = null;
    document.getElementById('projectTitle').value=''; 
    document.getElementById('projectTitle').readOnly=true;
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('ganttOuter').style.display='none';
    document.getElementById('summaryText').textContent='';
    ['btnOwners','btnSection','btnTask','btnPDF','btnSaveHTML'].forEach(bid=>document.getElementById(bid).style.display='none');
  }
  renderSidebar();
}

// ─────────────────────────────────────────────
// DATE UTILS
// ─────────────────────────────────────────────
function parseDate(s){ const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDisp(s){ if(!s) return '—'; const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function isWknd(d){ const w=d.getDay(); return w===0||w===6; }
function isHoliday(d){ return HOLIDAYS.has(fmtDate(d)); }
function isOff(d){ return isWknd(d)||isHoliday(d); }

// 翌稼働日（土日祝スキップ）。allDays=true のときは単純に翌日
function nextWD(ds, allDays){
  const d=parseDate(ds);
  d.setDate(d.getDate()+1);
  while(!allDays && isOff(d)) d.setDate(d.getDate()+1);
  return fmtDate(d);
}

// 稼働日数を数える（start〜end）。allDays=true のときはカレンダー日数
function countWorkdays(startDs, endDs, allDays){
  const s=parseDate(startDs), e=parseDate(endDs);
  let cnt=0, cur=new Date(s);
  while(cur<=e){ if(allDays || !isOff(cur)) cnt++; cur.setDate(cur.getDate()+1); }
  return cnt;
}

// 開始日から稼働日n日分の終了日を求める。allDays=true のときは土日祝も1日として数える
function addWorkdays(startDs, n, allDays){
  const d=parseDate(startDs);
  // 通常モードで開始日が休日なら稼働日起点まで進める
  while(!allDays && isOff(d)) d.setDate(d.getDate()+1);
  let cnt=1;
  while(cnt<n){ d.setDate(d.getDate()+1); if(allDays || !isOff(d)) cnt++; }
  return fmtDate(d);
}

// カレンダー日数（表示用・後方互換）
function diffD(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000)+1; }
// addD はカレンダー日数加算（バー幅計算用）
function addD(ds,n){ const d=parseDate(ds); d.setDate(d.getDate()+n); return fmtDate(d); }

function dateRange(){
  const ts=TSK();
  let sDate, eDate;
  if(!ts.length){
    // タスクがない場合は今月〜3ヶ月先を表示
    const today=new Date();
    sDate=new Date(today.getFullYear(),today.getMonth(),1);
    eDate=new Date(today.getFullYear(),today.getMonth()+3,0);
  } else {
    // 日付が空のタスクを除外
    const dated = ts.filter(t=>t.start && t.end);
    if(!dated.length){
      const today=new Date();
      sDate=new Date(today.getFullYear(),today.getMonth(),1);
      eDate=new Date(today.getFullYear(),today.getMonth()+3,0);
    } else {
      const minD=dated.reduce((m,t)=>t.start<m?t.start:m,dated[0].start);
      const maxD=dated.reduce((m,t)=>t.end>m?t.end:m,dated[0].end);
      sDate=parseDate(minD); sDate.setDate(1);
      eDate=parseDate(maxD); eDate.setMonth(eDate.getMonth()+1); eDate.setDate(0);
    }
  }
  const dates=[],cur=new Date(sDate);
  while(cur<=eDate){ dates.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  return dates;
}

function ownerMap(){ const m={}; OWN().forEach((o,i)=>m[o]=PALETTE[i%PALETTE.length]); return m; }
function getColor(owner){ return ownerMap()[owner]||PALETTE[0]; }

// ─────────────────────────────────────────────
// RECALC LINKED
// ─────────────────────────────────────────────
function recalcLinked(){
  const ts=TSK();
  for(let i=1;i<ts.length;i++){
    if(ts[i].link){
      // 前タスクの日付が空なら連動しない
      if(!ts[i-1].end) continue;
      const ad=!!ts[i].allDays;
      const ns=nextWD(ts[i-1].end, ad);
      // 日数（allDays時は土日祝込み）を維持して終了日を再計算
      const wd=ts[i]._wd || (ts[i].start && ts[i].end ? countWorkdays(ts[i].start, ts[i].end, ad) : 1);
      ts[i]._wd=wd;
      ts[i].start=ns;
      ts[i].end=addWorkdays(ns, wd, ad);
    }
  }
}

function updateField(id,field,value){
  const t=TSK().find(t=>t.id===id);
  if(!t) return;
  t[field]=value;
  // 日付が手動変更されたら稼働日数キャッシュをリセット
  if(field==='start'||field==='end') delete t._wd;
  render();
}
function toggleTaskFlag(id, flag){
  const t=TSK().find(t=>t.id===id);
  if(!t) return;
  t[flag]=!t[flag];
  // 現在の期間を新しいモードで数え直す
  delete t._wd;
  render();
}
function updateSection(id,field,value){ const s=SEC().find(s=>s.id===id); if(s) s[field]=value; }
function deleteTask(id){
  if(!confirm('このタスクを削除しますか？')) return;
  P().tasks=P().tasks.filter(t=>t.id!==id); render();
}
function deleteSection(id){
  const cnt=TSK().filter(t=>t.section===id).length;

  P().tasks=P().tasks.filter(t=>t.section!==id);
  P().sections=P().sections.filter(s=>s.id!==id);

}

const COL_ORDER = ['col-no','col-task','col-start','col-end','col-owner','col-days'];

let colWidths   = { 'col-no':56, 'col-task':200, 'col-start':100, 'col-end':100, 'col-owner':110, 'col-days':52 };

function applyColWidths(){
  // Update cell widths
  COL_ORDER.forEach(c=>{
    const w = colWidths[c];
    document.querySelectorAll('.' + c).forEach(el=>{
      el.style.width = w + 'px';
      el.style.minWidth = w + 'px';
    });
  });
  // Recalculate sticky left offsets
  let left = 0;
  COL_ORDER.forEach(c=>{
    document.querySelectorAll('th.' + c + ', td.' + c).forEach(el=>{ el.style.left = left + 'px'; });
    left += colWidths[c];
  });
}

let _resizeState = null;
function startColResize(e, col){
  e.preventDefault();
  e.stopPropagation();
  const handle = e.currentTarget;
  handle.classList.add('active');
  _resizeState = { col, startX: e.clientX, startW: colWidths[col], handle };

  function onMove(ev){
    if(!_resizeState) return;
    const newW = Math.max(COL_MIN[_resizeState.col], _resizeState.startW + ev.clientX - _resizeState.startX);
    colWidths[_resizeState.col] = newW;
    applyColWidths();
  }
  function onUp(){
    if(_resizeState) _resizeState.handle.classList.remove('active');
    _resizeState = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}



// ─────────────────────────────────────────────
// DRAG & DROP (セクション / タスク 並び替え)
// ─────────────────────────────────────────────
let _drag = null; // { type:'sec'|'task', id }

function onDragStart(e, type, id){
  _drag = { type, id };
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(()=>{ const el=e.currentTarget; if(el) el.classList.add('dragging'); }, 0);
}

function onDragOver(e, type){
  if(!_drag || _drag.type !== type) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tr = e.currentTarget;
  const rect = tr.getBoundingClientRect();
  const mid  = rect.top + rect.height / 2;
  tr.classList.remove('drag-over-top','drag-over-bottom');
  tr.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
}

function onDragLeave(e){
  e.currentTarget.classList.remove('drag-over-top','drag-over-bottom');
}

function onDrop(e, type, targetId){
  e.preventDefault();
  const tr = e.currentTarget;
  tr.classList.remove('drag-over-top','drag-over-bottom');
  document.querySelectorAll('tr.dragging').forEach(r=>r.classList.remove('dragging'));
  if(!_drag || _drag.type !== type || _drag.id === targetId){ _drag=null; return; }

  const rect = tr.getBoundingClientRect();
  const insertBefore = e.clientY < rect.top + rect.height / 2;

  if(type === 'sec'){
    const secs = P().sections;
    const fromIdx = secs.findIndex(s=>s.id===_drag.id);
    const toIdx   = secs.findIndex(s=>s.id===targetId);
    if(fromIdx < 0 || toIdx < 0){ _drag=null; return; }
    const [item] = secs.splice(fromIdx, 1);
    const newIdx  = secs.findIndex(s=>s.id===targetId);
    secs.splice(insertBefore ? newIdx : newIdx+1, 0, item);
  } else {
    const tasks = P().tasks;
    const fromIdx = tasks.findIndex(t=>t.id===_drag.id);
    const toIdx   = tasks.findIndex(t=>t.id===targetId);
    if(fromIdx < 0 || toIdx < 0){ _drag=null; return; }
    // ドロップ先のセクションに合わせてsectionも更新
    const targetSec = tasks[toIdx].section;
    const [item] = tasks.splice(fromIdx, 1);
    item.section = targetSec;
    const newIdx  = tasks.findIndex(t=>t.id===targetId);
    tasks.splice(insertBefore ? newIdx : newIdx+1, 0, item);
  }
  _drag = null;
  render();
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeOwnersModal(); closeNewProjModal(); } });
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
document.getElementById('ownersModalOverlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeOwnersModal(); });
document.getElementById('newProjModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeNewProjModal(); });

// ─────────────────────────────────────────────
// PERSIST: localStorage 自動保存
// ─────────────────────────────────────────────
const STORAGE_KEY = 'rhr_gantt_v3';
let importedStamp = null; // このブラウザに取り込み済みの「書き出しファイル」の識別子

function saveToStorage(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, currentPid, importedStamp }));
    const ind = document.getElementById('autoSaveIndicator');
    if(ind){ ind.textContent = '✓ 保存済み'; setTimeout(()=>{ if(ind) ind.textContent=''; }, 2000); }
  } catch(e){ console.warn('localStorage save failed', e); }
}

// 現在のデータを埋め込んだ、きれいなHTML文字列を作る
function buildExportHTML(){
  const payload = JSON.stringify({ exportedAt: String(Date.now()), projects, currentPid })
    .replace(/</g, '\\u003c');
  return PRISTINE_HTML.replace(
    /(<script id="embeddedData" type="application\/json">)[\s\S]*?(<\/script>)/,
    (m, open, close) => open + payload + close
  );
}

function saveAsHTML(){
  const blob = new Blob([buildExportHTML()], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `RHRスケジュール_${fmtDate(new Date())}.html`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// ─────────────────────────────────────────────
// INIT: ブラウザの保存データ / 書き出しファイルのデータから復元
// ─────────────────────────────────────────────
(function(){
  let embedded = null, local = null;
  try {
    const el = document.getElementById('embeddedData');
    const d = JSON.parse((el && el.textContent) || '{}');
    if(d && d.projects && d.projects.length > 0) embedded = d;
  } catch(e){ console.warn('embedded data load failed', e); }
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if(s){
      const p = JSON.parse(s);
      if(p && p.projects && p.projects.length > 0) local = p;
    }
  } catch(e){ console.warn('localStorage load failed', e); }

  let use = local;
  importedStamp = local ? (local.importedStamp || null) : null;
  if(embedded){
    if(!local){
      use = embedded; importedStamp = embedded.exportedAt;
    } else if(local.importedStamp !== embedded.exportedAt){
      // このブラウザにまだ取り込んでいない書き出しファイルを開いた場合
      const useFile = confirm('このファイルに保存されたデータが見つかりました。\n\nOK：ファイルのデータを読み込む（このブラウザの現在のデータは置き換わります）\nキャンセル：このブラウザの現在のデータをそのまま使う');
      if(useFile) use = embedded;
      importedStamp = embedded.exportedAt;
    }
  }

  if(use){
    projects = use.projects;
    renderSidebar();
    const pid = use.currentPid && projects.find(p=>p.id===use.currentPid) ? use.currentPid : projects[0].id;
    selectProject(pid);
    return;
  }
  // フォールバック: 空状態
  renderSidebar();
})();
</script>
